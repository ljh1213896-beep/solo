locale: zh_Hans

backend:
  name: github
  repo: ljh1213896-beep/ljh-0408.pages.dev
  branch: main
  base_url: https://ljh-0408.pages.dev
  auth_endpoint: api/decap/auth
  use_graphql: true

site_url: https://ljh-0408.pages.dev
display_url: https://ljh-0408.pages.dev
logo_url: https://ljh-0408.pages.dev/brands/ljh-mark.png
publish_mode: simple
media_folder: public/projects/uploads
public_folder: /projects/uploads

collections:
  - name: portfolio
    label: 作品集内容
    files:
      - name: projects
        label: 七个作品项目
        file: content/projects.json
        format: json
        description: "左侧展开项目并修改文字或封面，右侧会同步显示接近网站效果的实时预览。"
        fields:
          - name: projects
            label: 项目列表
            label_singular: 项目
            widget: list
            hint: "展开任意项目编辑；封面上传完成后会立即显示在右侧预览中。"
            summary: "{{fields.no}} · {{fields.title}}"
            minimize_collapsed: true
            fields:
              - { name: no, label: 项目编号, widget: string, hint: "请保持两位编号，例如 01" }
              - { name: slug, label: 固定网址标识, widget: string, hint: "请勿修改，否则项目专属页面会失效" }
              - { name: year, label: 年份, widget: string }
              - { name: title, label: 中文短标题, widget: string }
              - { name: fullTitle, label: 完整项目标题, widget: string }
              - { name: en, label: 英文标题, widget: string }
              - { name: type, label: 项目类型, widget: string }
              - { name: image, label: 封面图片, widget: image, choose_url: false }
              - { name: video, label: 封面/漫游视频路径, widget: string, required: false, hint: "大视频请先上传到 public/projects，再填写 /projects/文件名" }
              - { name: location, label: 地点, widget: string }
              - { name: role, label: 负责内容, widget: string }
              - { name: summary, label: 项目摘要, widget: text }
              - { name: concept, label: 设计概念, widget: text }
              - name: keywords
                label: 关键词
                widget: list
                field: { name: keyword, label: 关键词, widget: string }
  - name: site_pages
    label: 网站页面内容
    files:
      - name: home
        label: 首页文字与内容
        file: content/home.json
        format: json
        description: "修改入站动画、首页标题、L/J/H 三段理念与作品区文字。"
        fields:
          - name: header
            label: 顶部信息
            widget: object
            fields:
              - { name: practice, label: 实践类型, widget: string }
              - { name: locationYear, label: 地点与年份, widget: string }
              - { name: discipline, label: 设计方向, widget: string }
          - name: entry
            label: 入站动画文字
            widget: object
            fields:
              - { name: title, label: 主标题, widget: string }
              - { name: subtitle, label: 英文副标题, widget: string }
              - { name: cornerLeft, label: 左下角文字, widget: string }
              - { name: cornerRight, label: 右下角文字, widget: string }
          - name: hero
            label: 首页第一屏
            widget: object
            fields:
              - { name: tag, label: 章节标识, widget: string }
              - { name: mainTitle, label: 中文主标题, widget: string }
              - { name: subtitle, label: 英文副标题, widget: string }
              - { name: linePrefix, label: 标语前缀, widget: string }
              - { name: lineEmphasis, label: 洋红强调文字, widget: string }
              - { name: lineMiddle, label: 标语中段, widget: string }
              - { name: lineStrong, label: 加粗结尾, widget: string }
              - { name: lineEnglish, label: 标语英文, widget: string }
          - name: principles
            label: L / J / H 三段理念
            widget: list
            min: 3
            max: 3
            summary: "{{fields.tag}} · {{fields.title}}"
            fields:
              - { name: tag, label: 标识, widget: string }
              - { name: title, label: 标题, widget: string }
              - { name: copy, label: 中文说明, widget: string }
          - name: sceneWords
            label: 3D 场景文字
            widget: list
            min: 3
            max: 3
            field: { name: word, label: 文字, widget: string }
          - name: stageFooter
            label: 首页底部状态文字
            widget: list
            min: 3
            max: 3
            field: { name: item, label: 文字, widget: string }
          - name: gallery
            label: 作品区文字
            widget: object
            fields:
              - { name: marquee, label: 动态背景文字, widget: string }
              - { name: heading, label: 作品区标题, widget: string }
              - { name: interaction, label: 交互说明, widget: string }
              - { name: progress, label: 滚动提示, widget: string }
      - name: menu
        label: 菜单页
        file: content/menu.json
        format: json
        description: "修改菜单按钮、菜单项目名称/跳转位置和底部设计方向。"
        fields:
          - { name: closeLabel, label: 关闭按钮文字, widget: string }
          - name: items
            label: 菜单项目
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: 菜单文字, widget: string }
              - { name: href, label: 跳转位置, widget: string, hint: "首页 #top，个人介绍 #profile，作品 #work，联系 #contact" }
          - { name: footer, label: 菜单底部文字, widget: string }
      - name: profile
        label: 个人介绍页
        file: content/profile.json
        format: json
        description: "修改个人肖像、简介、教育、荣誉、技能、经历与奖项。"
        fields:
          - name: header
            label: 页面顶部三段文字
            widget: list
            min: 3
            max: 3
            field: { name: item, label: 文字, widget: string }
          - { name: portrait, label: 个人肖像, widget: image, choose_url: false }
          - { name: portraitCaption, label: 肖像标注, widget: string }
          - { name: name, label: 中文姓名, widget: string }
          - { name: nameEnglish, label: 英文姓名, widget: string }
          - { name: role, label: 身份定位, widget: string }
          - { name: introduction, label: 中文简介, widget: text }
          - { name: introductionEnglish, label: 英文简介, widget: text }
          - name: education
            label: 教育背景
            widget: object
            fields:
              - { name: school, label: 学校, widget: string }
              - { name: major, label: 专业, widget: string }
              - { name: period, label: 时间, widget: string }
              - { name: score, label: 学业情况, widget: string }
              - { name: ranking, label: 专业排名, widget: string }
          - name: honors
            label: 荣誉奖项
            widget: list
            summary: "{{fields.year}} · {{fields.title}}"
            fields:
              - { name: year, label: 年份, widget: string }
              - { name: title, label: 荣誉名称, widget: string }
          - name: skills
            label: 软件技能
            widget: list
            field: { name: skill, label: 技能名称, widget: string }
          - name: campusExperiences
            label: 校园经历
            widget: list
            summary: "{{fields.year}} · {{fields.title}}"
            fields:
              - { name: year, label: 年份, widget: string }
              - { name: title, label: 经历名称, widget: string }
          - name: academicAwards
            label: 学术竞赛与奖项
            widget: list
            summary: "{{fields.title}} · {{fields.award}}"
            fields:
              - { name: title, label: 项目/比赛名称, widget: string }
              - { name: award, label: 奖项, widget: string }
          - name: practice
            label: 科研与实践经历
            widget: list
            summary: "{{fields.title}} · {{fields.role}}"
            fields:
              - { name: title, label: 项目名称, widget: string }
              - { name: role, label: 负责角色, widget: string }
              - { name: description, label: 经历说明, widget: text }

